name: Klaesp
description: "a mobile LMS companion app that centralizes courses assignment deadlines and academic notifications in one place, helping student stay organized."
# Prevents accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  # Pinned to 6.x, whose API is used in google_sign_in_service.dart.
  # Version 7 changed the sign-in API, so upgrade only together with that file.
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
